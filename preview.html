<!doctype html>
<html><head><meta charset="utf-8"><title>Tejal GitHub README preview</title>
<style>
body{margin:0;background:#0d1117;color:#e8e4ed;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:32px}
.wrap{max-width:1100px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{border:1px solid #303642;border-radius:16px;padding:18px;background:#10141c}
img{max-width:100%;height:auto;display:block;margin:auto}
h1{color:#b8a7ff} code{color:#ffb7d5}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<h1>tejal.exe · profile assets</h1>
<p>Local preview of the animated portrait and custom README assets.</p>
<div class="grid">
<div class="card"><h3>Animated pixel portrait</h3><img src="assets/pixel-tejal.gif"></div>
<div class="card"><h3>Currently growing</h3><img src="assets/currently-growing.svg"></div>
<div class="card"><h3>Let's talk</h3><img src="assets/lets-talk.svg"></div>
<div class="card"><h3>Static portrait</h3><img src="assets/pixel-tejal.png"></div>
</div></div></body></html>
